[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "arr-doctor"
version = "0.2.0"
description = "MCP server to query and manage Sonarr, Radarr and Prowlarr from Claude Desktop"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "sonarr", "radarr", "prowlarr", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # 2.14 breaks against `mcp`, 4.x changes the API. Bump only with tests green.
    "fastmcp>=2.12,<2.13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
arr-doctor = "arr_doctor.server:main"

[tool.hatch.build.targets.wheel]
packages = ["arr_doctor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::authlib.deprecate.AuthlibDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501", "ASYNC109"]  # timeout params are passed through to httpx

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["arr_doctor"]
